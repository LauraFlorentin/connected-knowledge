name: Python checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r plugins/connected-knowledge/skills/zettelkasten-obsidian/scripts/requirements-dev.txt
      - run: python -m unittest discover -s plugins/connected-knowledge/skills/zettelkasten-obsidian/scripts/tests -v
      - run: python examples/run_graph_example.py
      - run: python examples/run_example.py --output "$RUNNER_TEMP/worked-example"
      - run: python tools/package.py
      - run: python tools/package_gemini.py
      - run: python tools/verify_package.py
  # Hooks, capture and the commands must run on the stock macOS Python with no packages.
  capture-stdlib:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - working-directory: plugins/connected-knowledge/skills/zettelkasten-obsidian/scripts/tests
        run: python -m unittest test_capture_pipeline test_ck_commands -v
